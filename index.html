<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Study Tasks · Nothing Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Georgia&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/vbotassisacat/manifest.json" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #000000;
            touch-action: pan-y;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* ===== Header with integrated date + live time ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 10px 16px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            background: #ffffff;
            z-index: 5;
        }
        .header h1 {
            font-family: 'Georgia', serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: -0.5px;
            color: #000;
        }
        .header-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1px;
            font-family: 'Georgia', serif;
        }
        .header-meta #dateDisplay {
            font-size: 12px;
            color: #999;
            letter-spacing: 0.3px;
        }
        .header-meta #liveTime {
            font-size: 17px;
            color: #000;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        /* ===== Page indicator ===== */
        .page-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px 0 4px;
            flex-shrink: 0;
            background: #ffffff;
            z-index: 5;
        }
        .page-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #ddd;
            transition: background 0.3s;
            cursor: pointer;
        }
        .page-indicator .dot.active { background: #e60000; }

        /* ===== Carousel ===== */
        .carousel {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
            touch-action: pan-y;
        }
        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1);
            will-change: transform;
        }
        .carousel-page {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 16px 20px 16px;
            overscroll-behavior: contain;
            background: #ffffff;
        }
        .carousel-page::-webkit-scrollbar { width: 3px; }
        .carousel-page::-webkit-scrollbar-track { background: #f0f0f0; }
        .carousel-page::-webkit-scrollbar-thumb { background: #ddd; border-radius: 999px; }

        /* ===== Shared styles ===== */
        .add-card {
            background: #f7f7f7;
            padding: 16px 16px 14px;
            margin-top: 4px;
            border: 1px solid #e5e5e5;
        }
        .add-card .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .add-card .row input {
            flex: 1;
            min-width: 100px;
            background: #ffffff;
            border: 1px solid #d0d0d0;
            padding: 10px 12px;
            font-size: 14px;
            color: #000;
            outline: none;
            font-family: 'Inter', sans-serif;
            border-radius: 0;
            touch-action: manipulation;
        }
        .add-card .row input:focus { border-color: #e60000; }
        .add-card .row input::placeholder { color: #bbb; }
        .add-card .long-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 6px 0 10px;
            flex-wrap: wrap;
        }
        .add-card .long-row label {
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .add-card .long-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e60000;
            background: #fff;
            border: 1px solid #d0d0d0;
            border-radius: 0;
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
        }
        .add-card .long-row input[type="checkbox"]:checked { background: #e60000; }
        .add-card .long-row input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: #fff;
            font-size: 14px;
            left: 2px;
            top: -1px;
        }
        .add-card .long-row .total-input {
            width: 70px;
            background: #ffffff;
            border: 1px solid #d0d0d0;
            padding: 6px 8px;
            font-size: 14px;
            color: #000;
            outline: none;
            border-radius: 0;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .add-card .long-row .total-input:focus { border-color: #e60000; }
        .add-btn {
            width: 100%;
            padding: 12px;
            background: #000000;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            border-radius: 999px;
            margin-top: 2px;
            touch-action: manipulation;
        }
        .add-btn:hover { background: #222; }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .task-item {
            background: #fafafa;
            border: 1px solid #e5e5e5;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            touch-action: manipulation;
        }
        .task-item .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item .top .info {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .task-item .top .info .subject {
            font-size: 15px;
            font-weight: 500;
            color: #000;
        }
        .task-item .top .info .time-target {
            font-size: 12px;
            color: #888;
        }
        .task-item .top .actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-item .top .actions button {
            background: none;
            border: none;
            font-size: 17px;
            cursor: pointer;
            padding: 2px 4px;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
            touch-action: manipulation;
        }
        .task-item .top .actions .done-btn { color: #e60000; font-size: 19px; }
        .task-item .top .actions .done-btn:hover { color: #cc0000; }
        .task-item .top .actions .delete-btn { color: #bbb; font-size: 17px; }
        .task-item .top .actions .delete-btn:hover { color: #e60000; }
        .task-item.done .subject { text-decoration: line-through; color: #aaa; }

        .progress-area { display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
        .progress-bar-track {
            width: 100%;
            height: 4px;
            background: #e5e5e5;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #e60000;
            width: 0%;
            border-radius: 999px;
            transition: width 0.3s;
        }
        .progress-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #555;
            flex-wrap: wrap;
            gap: 2px 0;
        }
        .progress-detail .left { display: flex; gap: 10px; flex-wrap: wrap; }
        .progress-detail .right .progress-btn {
            background: none;
            border: 1px solid #d0d0d0;
            color: #333;
            padding: 1px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .progress-detail .right .progress-btn:hover { border-color: #e60000; color: #000; }

        /* ===== Log ===== */
        .log-section {
            margin-top: 20px;
            border-top: 1px solid #e5e5e5;
            padding-top: 14px;
            padding-bottom: 10px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .log-header h2 {
            font-family: 'Georgia', serif;
            font-weight: 400;
            font-size: 17px;
            color: #888;
            letter-spacing: 0.3px;
        }
        .log-header .log-delete-toggle {
            background: none;
            border: 1px solid #d0d0d0;
            padding: 2px 14px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            color: #888;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .log-header .log-delete-toggle:hover { border-color: #e60000; color: #000; }
        .log-header .log-delete-toggle.active { border-color: #e60000; color: #e60000; }
        .log-entry {
            font-size: 12px;
            color: #888;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-entry .log-left {
            display: flex;
            justify-content: space-between;
            flex: 1;
            align-items: center;
        }
        .log-entry .log-left .action { color: #333; }
        .log-entry .log-left .time { color: #bbb; margin-left: 12px; }
        .log-entry .log-delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px 0 10px;
            transition: color 0.2s;
            font-family: 'Inter', sans-serif;
            display: none;
            touch-action: manipulation;
        }
        .log-entry .log-delete-btn:hover { color: #e60000; }
        .log-entry .log-delete-btn.show { display: inline; }
        .empty-msg {
            color: #ccc;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== Timer page ===== */
        .timer-page { padding-top: 4px; }
        .timer-tabs {
            display: flex;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 20px;
        }
        .timer-tabs .tab {
            flex: 1;
            padding: 12px 0 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: #999;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }
        .timer-tabs .tab.active { color: #000; border-bottom-color: #e60000; }
        .timer-display {
            font-family: 'Georgia', serif;
            font-size: 52px;
            text-align: center;
            padding: 16px 0 20px;
            letter-spacing: 2px;
            color: #000;
            font-variant-numeric: tabular-nums;
        }
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .timer-controls button {
            padding: 8px 28px;
            border: 1px solid #d0d0d0;
            background: #ffffff;
            color: #000;
            font-size: 14px;
            cursor: pointer;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            min-width: 70px;
            touch-action: manipulation;
        }
        .timer-controls button:hover { border-color: #e60000; }
        .timer-controls button.primary {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }
        .timer-controls button.primary:hover { background: #222; border-color: #222; }
        .timer-controls button.danger { border-color: #e60000; color: #e60000; }
        .timer-controls button.danger:hover { background: #e60000; color: #ffffff; }
        .timer-set {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        .timer-set input {
            width: 60px;
            padding: 6px 8px;
            border: 1px solid #d0d0d0;
            background: #ffffff;
            font-size: 16px;
            text-align: center;
            outline: none;
            font-family: 'Inter', sans-serif;
            border-radius: 0;
            color: #000;
            touch-action: manipulation;
        }
        .timer-set input:focus { border-color: #e60000; }
        .timer-set span { font-size: 16px; color: #888; font-family: 'Inter', sans-serif; }
        .lap-list {
            margin-top: 12px;
            border-top: 1px solid #e5e5e5;
            padding-top: 10px;
        }
        .lap-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #555;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .lap-item .lap-num { color: #999; }
        .lap-item .lap-time { font-family: 'Georgia', serif; font-variant-numeric: tabular-nums; }

        /* ===== Celebration ===== */
        .celebration-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .celebration-overlay.active { opacity: 1; pointer-events: auto; }
        .celebration-overlay .bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(230, 0, 0, 0.08);
            backdrop-filter: blur(2px);
        }
        .celebration-overlay .text {
            position: relative;
            font-family: 'Georgia', serif;
            font-size: 32px;
            color: #000;
            background: #fff;
            padding: 32px 48px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            letter-spacing: 2px;
            animation: popIn 0.4s ease;
        }
        .celebration-overlay .text .sub {
            font-size: 14px;
            color: #888;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            letter-spacing: 0px;
        }
        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ================================================================
           WEEKEND PLAN PAGE
           ================================================================ */
        .weekend-page { padding-top: 4px; }

        /* Slider card */
        .weekend-card {
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
            padding: 18px 16px 16px;
            margin-bottom: 14px;
        }
        .weekend-card h3 {
            font-family: 'Georgia', serif;
            font-weight: 400;
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .slider-display {
            font-family: 'Georgia', serif;
            font-size: 30px;
            text-align: center;
            color: #000;
            letter-spacing: 1px;
            margin: 4px 0 4px;
            font-variant-numeric: tabular-nums;
        }
        .slider-sublabel {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #999;
            margin-bottom: 4px;
            letter-spacing: 0.2px;
        }
        .slider-labels .mid { color: #ccc; }

        input[type="range"].nt-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: #e5e5e5;
            border-radius: 999px;
            outline: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        input[type="range"].nt-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e60000;
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 1px #e60000, 0 2px 6px rgba(0,0,0,0.12);
            transition: transform 0.15s;
        }
        input[type="range"].nt-slider::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
        input[type="range"].nt-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e60000;
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 1px #e60000, 0 2px 6px rgba(0,0,0,0.12);
        }

        .time-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid #e5e5e5;
            margin-top: 4px;
            font-size: 13px;
            color: #555;
        }
        .time-info-row .label {
            font-family: 'Inter', sans-serif;
            color: #888;
            letter-spacing: 0.3px;
        }
        .time-info-row .value {
            font-family: 'Georgia', serif;
            color: #000;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }
        .time-info-row .value.warn { color: #e60000; }

        /* Photo upload */
        .photo-upload-area {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .photo-upload-btn {
            padding: 6px 18px;
            border: 1px solid #d0d0d0;
            background: #ffffff;
            color: #333;
            font-size: 12px;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .photo-upload-btn:hover { border-color: #e60000; color: #000; }
        .photo-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .photo-thumb {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border: 1px solid #e5e5e5;
            cursor: pointer;
        }

        /* Reminder */
        .reminder-box {
            margin-top: 8px;
            padding: 8px 12px;
            background: #fff8f8;
            border-left: 2px solid #e60000;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            letter-spacing: 0.2px;
            font-family: 'Inter', sans-serif;
        }
        .reminder-box .tag {
            color: #e60000;
            font-weight: 500;
            margin-right: 6px;
        }

        /* Remaining time badge */
        .remaining-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            margin-top: 4px;
            width: fit-content;
        }
        .remaining-badge.ok {
            background: #f0f0f0;
            color: #666;
        }
        .remaining-badge.soon {
            background: #fff0f0;
            color: #e60000;
        }
        .remaining-badge.now {
            background: #e60000;
            color: #ffffff;
        }
        .remaining-badge.overdue {
            background: #000000;
            color: #ffffff;
        }
        .remaining-badge.done {
            background: #e60000;
            color: #ffffff;
        }

        /* Supervisor */
        .supervisor-toggle {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }
        .supervisor-toggle button {
            background: none;
            border: 1px solid #d0d0d0;
            padding: 4px 16px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            color: #888;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            touch-action: manipulation;
        }
        .supervisor-toggle button:hover { border-color: #e60000; color: #000; }
        .supervisor-toggle button.active {
            border-color: #e60000;
            color: #e60000;
            background: #fff8f8;
        }

        .supervisor-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .supervisor-item {
            background: #fafafa;
            border: 1px solid #e5e5e5;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .supervisor-item .row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .supervisor-item .row1 .name {
            font-size: 15px;
            font-weight: 500;
            color: #000;
        }
        .supervisor-item .row1 .status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            font-family: 'Inter', sans-serif;
        }
        .supervisor-item .row1 .status.done {
            background: #e60000;
            color: #fff;
        }
        .supervisor-item .row1 .status.pending {
            background: #f0f0f0;
            color: #888;
        }
        .supervisor-item .row1 .status.overdue {
            background: #000;
            color: #fff;
        }
        .supervisor-item .meta {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .supervisor-item .meta .highlight {
            color: #e60000;
        }
        .supervisor-item .thumbs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .supervisor-item .thumbs img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border: 1px solid #e5e5e5;
            cursor: pointer;
        }

        /* Photo viewer */
        .photo-viewer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .photo-viewer.show { display: flex; }
        .photo-viewer img {
            max-width: 90%;
            max-height: 85%;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="header">
            <h1>Study Tasks</h1>
            <div class="header-meta">
                <span id="dateDisplay"></span>
                <span id="liveTime"></span>
            </div>
        </div>

        <div class="page-indicator" id="pageIndicator">
            <span class="dot" data-page="0"></span>
            <span class="dot active" data-page="1"></span>
            <span class="dot" data-page="2"></span>
        </div>

        <div class="carousel" id="carousel">
            <div class="carousel-track" id="track">
                <div class="carousel-page" id="taskPage"></div>
                <div class="carousel-page weekend-page" id="weekendPage"></div>
                <div class="carousel-page timer-page" id="timerPage"></div>
            </div>
        </div>
    </div>

    <div class="celebration-overlay" id="celebrationOverlay">
        <div class="bg"></div>
        <div class="text">
            <div>✦ Done</div>
            <div class="sub">All lessons completed</div>
        </div>
    </div>

    <div class="photo-viewer" id="photoViewer">
        <img id="photoViewerImg" src="" alt="" />
    </div>

    <script>
        (function() {
            // ================================================================
            // Data
            // ================================================================
            let tasks = [];
            let logs = [];
            let weekendTasks = [];   // { id, subject, duration, deadline, completed, photos, createdAt }
            let celebrationTimer = null;
            let logDeleteMode = false;
            let supervisorMode = false;

            // ================================================================
            // DOM
            // ================================================================
            const track = document.getElementById('track');
            const taskPage = document.getElementById('taskPage');
            const timerPage = document.getElementById('timerPage');
            const weekendPage = document.getElementById('weekendPage');
            const dots = document.querySelectorAll('.dot');
            const celebrationEl = document.getElementById('celebrationOverlay');
            const photoViewer = document.getElementById('photoViewer');
            const photoViewerImg = document.getElementById('photoViewerImg');

            let currentPage = 1; // default: weekend plan

            // ================================================================
            // Header clock — integrated at top
            // ================================================================
            function updateHeaderClock() {
                const now = new Date();
                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const dateStr = dayNames[now.getDay()] + ' ' + (now.getMonth() + 1) + '/' + now.getDate();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                const dateEl = document.getElementById('dateDisplay');
                const timeEl = document.getElementById('liveTime');
                if (dateEl) dateEl.textContent = dateStr;
                if (timeEl) timeEl.textContent = hh + ':' + mm + ':' + ss;
            }
            setInterval(updateHeaderClock, 1000);
            updateHeaderClock();

            // ================================================================
            // Persistence
            // ================================================================
            function loadData() {
                try {
                    const saved = localStorage.getItem('nothing_tasks');
                    if (saved) tasks = JSON.parse(saved);
                    const savedLogs = localStorage.getItem('nothing_logs');
                    if (savedLogs) logs = JSON.parse(savedLogs);
                    const savedWeekend = localStorage.getItem('nothing_weekend');
                    if (savedWeekend) weekendTasks = JSON.parse(savedWeekend);
                } catch (e) { /* ignore */ }
            }

            function saveData() {
                localStorage.setItem('nothing_tasks', JSON.stringify(tasks));
                localStorage.setItem('nothing_logs', JSON.stringify(logs));
                localStorage.setItem('nothing_weekend', JSON.stringify(weekendTasks));
            }

            // ================================================================
            // Time helpers
            // Window: Fri 19:00 → Sun 16:00 = 45 hours = 2700 min
            // Slider step: 15 min → max = 180
            // ================================================================
            const WINDOW_TOTAL_MIN = 45 * 60; // 2700

            function formatWeekendTime(minFromStart) {
                // minFromStart is minutes from Fri 19:00
                // Convert to real-world day + time
                const totalMin = 19 * 60 + minFromStart; // minutes from Fri 00:00
                const dayIndex = Math.floor(totalMin / (24 * 60)); // 0=Fri, 1=Sat, 2=Sun
                const minOfDay = totalMin % (24 * 60);
                const hh = String(Math.floor(minOfDay / 60)).padStart(2, '0');
                const mm = String(minOfDay % 60).padStart(2, '0');
                const dayNames = ['Fri', 'Sat', 'Sun'];
                const d = dayNames[Math.min(dayIndex, 2)];
                return d + ' ' + hh + ':' + mm;
            }

            function formatDuration(min) {
                if (min <= 0) return '0min';
                const h = Math.floor(min / 60);
                const m = min % 60;
                if (h === 0) return m + 'min';
                if (m === 0) return h + 'h';
                return h + 'h ' + m + 'min';
            }

            // Returns minutes from now until the latest start time of a task.
            // Window is Fri 19:00 → Sun 16:00.
            function minutesUntilLatestStart(task) {
                const now = new Date();
                const day = now.getDay(); // 0=Sun, 1=Mon, ..., 5=Fri, 6=Sat
                const h = now.getHours();
                const m = now.getMinutes();
                const nowMin = h * 60 + m;

                const latestStartOffset = task.deadline - task.duration;

                let currentOffset = null;

                if (day === 5 && h >= 19) {
                    // Friday after 19:00
                    currentOffset = nowMin - 19 * 60;
                } else if (day === 6) {
                    // Saturday — 5 hours from Fri 19:00 to Sat 00:00 = 300 min
                    currentOffset = 5 * 60 + nowMin;
                } else if (day === 0 && h < 16) {
                    // Sunday before 16:00 — 29 hours from Fri 19:00 to Sun 00:00 = 1740 min
                    currentOffset = 29 * 60 + nowMin;
                }

                if (currentOffset !== null) {
                    return latestStartOffset - currentOffset;
                }

                // Outside the window — compute distance to next Friday 19:00
                let daysToFri = (5 - day + 7) % 7;
                if (daysToFri === 0 && h >= 19) daysToFri = 7;
                const minutesToFri19 = daysToFri * 24 * 60 + (19 * 60 - nowMin);
                return minutesToFri19 + latestStartOffset;
            }

            function formatRemaining(min) {
                if (min <= 0) {
                    const over = Math.abs(min);
                    return 'overdue by ' + formatDuration(over);
                }
                return formatDuration(min) + ' until latest start';
            }

            // ================================================================
            // Log
            // ================================================================
            function addLog(subject, action) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                logs.push({ subject, action, time: timeStr });
                if (logs.length > 200) logs.shift();
                saveData();
                renderTasks();
            }

            function deleteLog(index) {
                if (index < 0 || index >= logs.length) return;
                logs.splice(index, 1);
                saveData();
                renderTasks();
            }

            // ================================================================
            // Utilities
            // ================================================================
            function parseTimeToHours(str) {
                str = str.trim().toLowerCase();
                if (str.endsWith('h')) {
                    const val = parseFloat(str.replace('h', '').trim());
                    return isNaN(val) ? 0 : val;
                }
                if (str.endsWith('min')) {
                    const val = parseFloat(str.replace('min', '').trim());
                    return isNaN(val) ? 0 : val / 60;
                }
                const num = parseFloat(str);
                return isNaN(num) ? 0 : num;
            }

            function formatHours(hours) {
                if (hours < 0.01) return '0min';
                if (hours < 1) return Math.round(hours * 60) + 'min';
                const h = Math.floor(hours);
                const m = Math.round((hours - h) * 60);
                if (m === 0) return h + 'h';
                return h + 'h ' + m + 'min';
            }

            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            function formatLapTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                const cs = Math.floor((seconds % 1) * 100);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
            }

            function triggerCelebration() {
                if (celebrationTimer) clearTimeout(celebrationTimer);
                celebrationEl.classList.add('active');
                celebrationTimer = setTimeout(() => {
                    celebrationEl.classList.remove('active');
                    celebrationTimer = null;
                }, 2500);
            }

            // ================================================================
            // Photo handling
            // ================================================================
            function compressImage(file, maxDim, quality) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            let { width, height } = img;
                            if (width > height && width > maxDim) {
                                height = height * (maxDim / width);
                                width = maxDim;
                            } else if (height > maxDim) {
                                width = width * (maxDim / height);
                                height = maxDim;
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            function openPhotoViewer(src) {
                photoViewerImg.src = src;
                photoViewer.classList.add('show');
            }
            photoViewer.addEventListener('click', () => {
                photoViewer.classList.remove('show');
                photoViewerImg.src = '';
            });

            // ================================================================
            // TASK PAGE (no subtitle)
            // ================================================================
            function renderTasks() {
                let html = '';

                html += `
                    <div class="add-card">
                        <div class="row">
                            <input type="text" id="subjectInput" placeholder="Subject" />
                            <input type="text" id="timeInput" placeholder="Target time / total time" />
                        </div>
                        <div class="long-row">
                            <label>
                                <input type="checkbox" id="isLongTask" />
                                Long-term task
                            </label>
                            <input type="number" id="totalCount" class="total-input" placeholder="Lessons" min="1" disabled />
                        </div>
                        <button class="add-btn" id="addTaskBtn">Add Task</button>
                    </div>
                `;

                if (tasks.length === 0) {
                    html += `<div class="empty-msg">No tasks yet</div>`;
                } else {
                    html += `<div class="task-list">`;
                    for (let i = 0; i < tasks.length; i++) {
                        const task = tasks[i];
                        const isDone = task.done || false;
                        const isLong = task.isLong || false;
                        const doneClass = isDone ? 'done' : '';

                        if (isLong) {
                            const total = task.total || 0;
                            const completed = task.completed || 0;
                            const progress = total > 0 ? Math.min(100, (completed / total) * 100) : 0;
                            const remaining = total - completed;
                            let perLessonHours = 0;
                            let remainingHours = 0;
                            if (task.time) {
                                const totalTimeHours = parseTimeToHours(task.time);
                                if (total > 0) {
                                    perLessonHours = totalTimeHours / total;
                                    remainingHours = perLessonHours * remaining;
                                }
                            }
                            const perLessonStr = perLessonHours > 0 ? formatHours(perLessonHours) : '--';
                            const remainingStr = remainingHours > 0 ? formatHours(remainingHours) : '--';
                            const totalTimeStr = task.time || '--';

                            html += `
                                <div class="task-item ${doneClass}" data-index="${i}">
                                    <div class="top">
                                        <div class="info">
                                            <span class="subject">${task.subject}</span>
                                            <span class="time-target">${totalTimeStr} total · ${perLessonStr} / lesson</span>
                                        </div>
                                        <div class="actions">
                                            <button class="delete-btn" data-index="${i}" data-action="delete">✕</button>
                                        </div>
                                    </div>
                                    <div class="progress-area">
                                        <div class="progress-bar-track">
                                            <div class="progress-bar-fill" style="width:${progress}%"></div>
                                        </div>
                                        <div class="progress-detail">
                                            <div class="left">
                                                <span>${completed}/${total} done</span>
                                                <span>${remaining} left</span>
                                                <span>est. ${remainingStr} remaining</span>
                                            </div>
                                            <div class="right">
                                                <button class="progress-btn" data-index="${i}" data-action="increment">+1 lesson</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            html += `
                                <div class="task-item ${doneClass}" data-index="${i}">
                                    <div class="top">
                                        <div class="info">
                                            <span class="subject">${task.subject}</span>
                                            <span class="time-target">${task.time || ''}</span>
                                        </div>
                                        <div class="actions">
                                            <button class="done-btn" data-index="${i}" data-action="toggle">${isDone ? '↺' : '✓'}</button>
                                            <button class="delete-btn" data-index="${i}" data-action="delete">✕</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                    html += `</div>`;
                }

                html += `<div class="log-section">`;
                html += `
                    <div class="log-header">
                        <h2>Study Log</h2>
                        <button class="log-delete-toggle${logDeleteMode ? ' active' : ''}" id="logDeleteToggle">${logDeleteMode ? '✕ Done' : 'Delete'}</button>
                    </div>
                `;
                if (logs.length === 0) {
                    html += `<div class="empty-msg">No records yet</div>`;
                } else {
                    const recent = logs.slice(-30).reverse();
                    for (let i = 0; i < recent.length; i++) {
                        const log = recent[i];
                        const idx = logs.length - 1 - i;
                        html += `
                            <div class="log-entry" data-log-index="${idx}">
                                <div class="log-left">
                                    <span class="action">${log.subject} · ${log.action}</span>
                                    <span class="time">${log.time}</span>
                                </div>
                                <button class="log-delete-btn${logDeleteMode ? ' show' : ''}" data-log-index="${idx}">✕</button>
                            </div>
                        `;
                    }
                }
                html += `</div>`;

                taskPage.innerHTML = html;

                document.querySelectorAll('[data-action="toggle"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        toggleTask(idx);
                    });
                });
                document.querySelectorAll('[data-action="increment"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        incrementTask(idx);
                    });
                });
                document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        deleteTask(idx);
                    });
                });
                document.querySelectorAll('.log-delete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.logIndex);
                        deleteLog(idx);
                    });
                });
                const toggleBtn = document.getElementById('logDeleteToggle');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', function() {
                        logDeleteMode = !logDeleteMode;
                        renderTasks();
                    });
                }
                const addBtn = document.getElementById('addTaskBtn');
                if (addBtn) addBtn.addEventListener('click', addTask);
                const longCheck = document.getElementById('isLongTask');
                if (longCheck) {
                    longCheck.addEventListener('change', function() {
                        const checked = this.checked;
                        const tc = document.getElementById('totalCount');
                        if (tc) tc.disabled = !checked;
                        if (checked && tc) tc.focus();
                    });
                }
            }

            function toggleTask(index) {
                if (index < 0 || index >= tasks.length) return;
                const task = tasks[index];
                if (task.isLong) return;
                task.done = !task.done;
                if (task.done) addLog(task.subject, 'Completed');
                else addLog(task.subject, 'Uncompleted');
                saveData();
                renderTasks();
            }

            function incrementTask(index) {
                if (index < 0 || index >= tasks.length) return;
                const task = tasks[index];
                if (!task.isLong) return;
                if (task.completed < task.total) {
                    task.completed++;
                    addLog(task.subject, `1 lesson done (${task.completed}/${task.total})`);
                    saveData();
                    renderTasks();
                    if (task.completed === task.total) triggerCelebration();
                } else {
                    triggerCelebration();
                }
            }

            function deleteTask(index) {
                if (index < 0 || index >= tasks.length) return;
                const task = tasks[index];
                if (confirm(`Delete task "${task.subject}"?`)) {
                    tasks.splice(index, 1);
                    addLog(task.subject, 'Deleted');
                    saveData();
                    renderTasks();
                }
            }

            function addTask() {
                const sub = document.getElementById('subjectInput');
                const time = document.getElementById('timeInput');
                const isLong = document.getElementById('isLongTask');
                const tc = document.getElementById('totalCount');
                if (!sub || !time || !isLong || !tc) return;

                const subject = sub.value.trim();
                const timeVal = time.value.trim();
                const long = isLong.checked;
                let total = 0;

                if (long) {
                    total = parseInt(tc.value) || 0;
                    if (total <= 0) { alert('Please enter a valid number of lessons (at least 1)'); return; }
                    if (!timeVal) { alert('Please enter total time (e.g. 3h)'); return; }
                    const hours = parseTimeToHours(timeVal);
                    if (hours <= 0) { alert('Please enter a valid time (e.g. 3h or 90min)'); return; }
                }
                if (!subject) { alert('Please enter a subject'); return; }

                const task = {
                    subject: subject,
                    time: timeVal || '',
                    isLong: long,
                    total: long ? total : 0,
                    completed: 0,
                    done: false
                };
                tasks.push(task);
                addLog(subject, long ? `Created long-term task (${total} lessons, ${timeVal})` : 'Created task');
                saveData();
                renderTasks();
                sub.value = '';
                time.value = '';
                isLong.checked = false;
                tc.value = '';
                tc.disabled = true;
                sub.focus();
            }

            // ================================================================
            // TIMER PAGE (no subtitle)
            // ================================================================
            let timerMode = 'countdown';
            let timerRunning = false;
            let timerInterval = null;
            let countdownSeconds = 0;
            let countdownTotal = 0;
            let stopwatchSeconds = 0;
            let laps = [];
            let lapCount = 0;

            function renderTimer() {
                const mode = timerMode;
                let html = '';

                html += `
                    <div class="timer-tabs">
                        <div class="tab ${mode === 'countdown' ? 'active' : ''}" data-mode="countdown">Timer</div>
                        <div class="tab ${mode === 'stopwatch' ? 'active' : ''}" data-mode="stopwatch">Stopwatch</div>
                    </div>
                `;

                if (mode === 'countdown') {
                    html += `
                        <div class="timer-display" id="timerDisplay">${formatTime(countdownSeconds)}</div>
                        <div class="timer-set" id="timerSet">
                            <input type="number" id="setMinutes" placeholder="0" min="0" value="0" />
                            <span>min</span>
                            <input type="number" id="setSeconds" placeholder="0" min="0" max="59" value="0" />
                            <span>sec</span>
                        </div>
                        <div class="timer-controls">
                            <button id="timerStartBtn" class="primary">${timerRunning ? 'Pause' : 'Start'}</button>
                            <button id="timerResetBtn">Reset</button>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="timer-display" id="timerDisplay">${formatLapTime(stopwatchSeconds)}</div>
                        <div class="timer-controls">
                            <button id="timerStartBtn" class="primary">${timerRunning ? 'Pause' : 'Start'}</button>
                            <button id="timerLapBtn" ${!timerRunning ? 'disabled style="opacity:0.4;"' : ''}>Lap</button>
                            <button id="timerResetBtn">Reset</button>
                        </div>
                        <div class="lap-list" id="lapList">
                            ${laps.map((l, i) => `
                                <div class="lap-item">
                                    <span class="lap-num">Lap ${i + 1}</span>
                                    <span class="lap-time">${formatLapTime(l)}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                timerPage.innerHTML = html;

                document.querySelectorAll('.timer-tabs .tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        const newMode = this.dataset.mode;
                        if (newMode === timerMode) return;
                        if (timerRunning) { clearInterval(timerInterval); timerRunning = false; }
                        timerMode = newMode;
                        if (timerMode === 'countdown') countdownSeconds = countdownTotal || 0;
                        renderTimer();
                    });
                });

                const startBtn = document.getElementById('timerStartBtn');
                const resetBtn = document.getElementById('timerResetBtn');
                if (startBtn) startBtn.addEventListener('click', toggleTimer);
                if (resetBtn) resetBtn.addEventListener('click', resetTimer);

                if (mode === 'countdown') {
                    const setMin = document.getElementById('setMinutes');
                    const setSec = document.getElementById('setSeconds');
                    if (setMin && setSec) {
                        setMin.addEventListener('change', updateCountdownSet);
                        setSec.addEventListener('change', updateCountdownSet);
                        if (!timerRunning && countdownTotal > 0) {
                            const mins = Math.floor(countdownTotal / 60);
                            const secs = Math.floor(countdownTotal % 60);
                            setMin.value = mins; setSec.value = secs;
                        }
                    }
                }

                if (mode === 'stopwatch') {
                    const lapBtn = document.getElementById('timerLapBtn');
                    if (lapBtn) {
                        lapBtn.addEventListener('click', function() {
                            if (timerRunning) {
                                laps.push(stopwatchSeconds);
                                lapCount++;
                                renderTimer();
                            }
                        });
                    }
                }
            }

            function updateCountdownSet() {
                if (timerRunning) return;
                const mins = parseInt(document.getElementById('setMinutes').value) || 0;
                const secs = parseInt(document.getElementById('setSeconds').value) || 0;
                countdownTotal = mins * 60 + secs;
                countdownSeconds = countdownTotal;
                const disp = document.getElementById('timerDisplay');
                if (disp) disp.textContent = formatTime(countdownSeconds);
            }

            function toggleTimer() {
                if (timerMode === 'countdown') {
                    if (countdownTotal <= 0 && !timerRunning) {
                        const mins = parseInt(document.getElementById('setMinutes')?.value) || 0;
                        const secs = parseInt(document.getElementById('setSeconds')?.value) || 0;
                        countdownTotal = mins * 60 + secs;
                        countdownSeconds = countdownTotal;
                        if (countdownTotal <= 0) return;
                        const disp = document.getElementById('timerDisplay');
                        if (disp) disp.textContent = formatTime(countdownSeconds);
                    }
                    if (timerRunning) { clearInterval(timerInterval); timerRunning = false; renderTimer(); return; }
                    if (countdownSeconds <= 0) countdownSeconds = countdownTotal;
                    timerRunning = true;
                    renderTimer();
                    timerInterval = setInterval(() => {
                        countdownSeconds--;
                        const disp = document.getElementById('timerDisplay');
                        if (disp) disp.textContent = formatTime(countdownSeconds);
                        if (countdownSeconds <= 0) {
                            clearInterval(timerInterval); timerRunning = false;
                            if (navigator.vibrate) navigator.vibrate(200);
                            renderTimer();
                        }
                    }, 1000);
                } else {
                    if (timerRunning) { clearInterval(timerInterval); timerRunning = false; renderTimer(); return; }
                    timerRunning = true;
                    renderTimer();
                    const startTime = Date.now() - stopwatchSeconds * 1000;
                    timerInterval = setInterval(() => {
                        stopwatchSeconds = (Date.now() - startTime) / 1000;
                        const disp = document.getElementById('timerDisplay');
                        if (disp) disp.textContent = formatLapTime(stopwatchSeconds);
                    }, 50);
                }
            }

            function resetTimer() {
                clearInterval(timerInterval);
                timerRunning = false;
                if (timerMode === 'countdown') countdownSeconds = countdownTotal || 0;
                else { stopwatchSeconds = 0; laps = []; lapCount = 0; }
                renderTimer();
            }

            // ================================================================
            // WEEKEND PLAN PAGE
            // ================================================================
            function renderWeekend() {
                let html = '';

                // Deadline slider card
                // Default slider value: 68 → 68*15 = 1020 min = Sat 12:00
                const sliderValue = 68;
                html += `
                    <div class="weekend-card">
                        <h3>Set Deadline</h3>
                        <div class="slider-display" id="sliderDisplay">Sat 12:00</div>
                        <div class="slider-sublabel"></div>
                        <div class="slider-labels">
                            <span>Fri 19:00</span>
                            <span class="mid">Sat 17:30</span>
                            <span>Sun 16:00</span>
                        </div>
                        <input type="range" class="nt-slider" id="deadlineSlider" min="0" max="180" value="${sliderValue}" step="1" />
                    </div>
                `;

                // Task creation card
                html += `
                    <div class="weekend-card">
                        <h3>New Task</h3>
                        <div class="row" style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
                            <input type="text" id="weekendSubject" placeholder="Subject" style="flex:1;min-width:100px;background:#fff;border:1px solid #d0d0d0;padding:10px 12px;font-size:14px;color:#000;outline:none;font-family:Inter,sans-serif;" />
                            <input type="number" id="weekendDuration" placeholder="Duration (min)" min="5" step="5" style="width:130px;background:#fff;border:1px solid #d0d0d0;padding:10px 12px;font-size:14px;color:#000;outline:none;font-family:Inter,sans-serif;" />
                        </div>
                        <div class="time-info-row" style="border-top:none;margin-top:0;padding-top:0;">
                            <span class="label">Latest start</span>
                            <span class="value" id="latestStartPreview">—</span>
                        </div>
                        <button class="add-btn" id="addWeekendBtn" style="margin-top:10px;">Add Weekend Task</button>
                    </div>
                `;

                // Task list card
                html += `
                    <div class="weekend-card" style="background:#ffffff;padding-left:0;padding-right:0;border-left:none;border-right:none;">
                        <div style="padding:0 16px;">
                            <div class="supervisor-toggle">
                                <button id="supervisorToggleBtn" class="${supervisorMode ? 'active' : ''}">${supervisorMode ? '✕ Close View' : 'Supervisor View'}</button>
                            </div>
                        </div>
                        <div style="padding:0 16px;" id="weekendTaskListWrap">
                            ${renderWeekendList()}
                        </div>
                    </div>
                `;

                weekendPage.innerHTML = html;

                // Bind slider
                const slider = document.getElementById('deadlineSlider');
                const sliderDisplay = document.getElementById('sliderDisplay');
                const latestStartPreview = document.getElementById('latestStartPreview');
                const durationInput = document.getElementById('weekendDuration');

                function updateSliderPreview() {
                    const minFromStart = parseInt(slider.value) * 15;
                    sliderDisplay.textContent = formatWeekendTime(minFromStart);
                    const dur = parseInt(durationInput.value) || 0;
                    if (dur > 0) {
                        const latest = minFromStart - dur;
                        if (latest < 0) {
                            latestStartPreview.textContent = 'Impossible — start now';
                            latestStartPreview.classList.add('warn');
                        } else {
                            latestStartPreview.textContent = formatWeekendTime(latest);
                            latestStartPreview.classList.remove('warn');
                        }
                    } else {
                        latestStartPreview.textContent = '—';
                        latestStartPreview.classList.remove('warn');
                    }
                }

                slider.addEventListener('input', updateSliderPreview);
                durationInput.addEventListener('input', updateSliderPreview);
                updateSliderPreview();

                const addWeekendBtn = document.getElementById('addWeekendBtn');
                if (addWeekendBtn) addWeekendBtn.addEventListener('click', addWeekendTask);

                bindWeekendActions();

                const supBtn = document.getElementById('supervisorToggleBtn');
                if (supBtn) {
                    supBtn.addEventListener('click', function() {
                        supervisorMode = !supervisorMode;
                        renderWeekend();
                    });
                }
            }

            function renderWeekendList() {
                if (weekendTasks.length === 0) {
                    return `<div class="empty-msg">No weekend tasks yet</div>`;
                }

                if (supervisorMode) {
                    let html = `<div class="supervisor-list">`;
                    for (let i = 0; i < weekendTasks.length; i++) {
                        const t = weekendTasks[i];
                        const deadline = t.deadline;
                        const latestStart = deadline - t.duration;
                        const remainMin = minutesUntilLatestStart(t);
                        const status = t.completed ? 'done' : (remainMin < 0 ? 'overdue' : 'pending');
                        const statusLabel = t.completed ? 'Completed' : (remainMin < 0 ? 'Overdue' : 'Pending');
                        html += `
                            <div class="supervisor-item">
                                <div class="row1">
                                    <span class="name">${t.subject}</span>
                                    <span class="status ${status}">${statusLabel}</span>
                                </div>
                                <div class="meta">
                                    <span>Deadline: <span class="highlight">${formatWeekendTime(deadline)}</span></span>
                                    <span>Duration: ${formatDuration(t.duration)}</span>
                                    <span>Latest start: ${latestStart >= 0 ? formatWeekendTime(latestStart) : '—'}</span>
                                </div>
                                ${t.photos && t.photos.length ? `
                                    <div class="thumbs">
                                        ${t.photos.map((p, pi) => `<img src="${p}" data-photo="${i}-${pi}" />`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }
                    html += `</div>`;
                    setTimeout(() => {
                        document.querySelectorAll('.supervisor-item .thumbs img').forEach(img => {
                            img.addEventListener('click', function() {
                                openPhotoViewer(this.src);
                            });
                        });
                    }, 0);
                    return html;
                }

                let html = `<div class="task-list">`;
                for (let i = 0; i < weekendTasks.length; i++) {
                    const t = weekendTasks[i];
                    const latestStart = t.deadline - t.duration;
                    const remainMin = minutesUntilLatestStart(t);
                    const overdue = !t.completed && remainMin < 0;
                    const soon = !t.completed && remainMin >= 0 && remainMin < 30;
                    const doneClass = t.completed ? 'done' : '';

                    let badgeClass = 'ok';
                    let badgeText = '';
                    if (t.completed) {
                        badgeClass = 'done';
                        badgeText = '✓ completed';
                    } else if (overdue) {
                        badgeClass = 'overdue';
                        badgeText = formatRemaining(remainMin);
                    } else if (soon) {
                        badgeClass = 'now';
                        badgeText = formatRemaining(remainMin);
                    } else {
                        badgeClass = 'ok';
                        badgeText = formatRemaining(remainMin);
                    }

                    html += `
                        <div class="task-item ${doneClass}" data-wi="${i}">
                            <div class="top">
                                <div class="info">
                                    <span class="subject">${t.subject}</span>
                                    <span class="time-target">${formatDuration(t.duration)} · due ${formatWeekendTime(t.deadline)}</span>
                                </div>
                                <div class="actions">
                                    <button class="done-btn" data-wi="${i}" data-waction="toggle">${t.completed ? '↺' : '✓'}</button>
                                    <button class="delete-btn" data-wi="${i}" data-waction="delete">✕</button>
                                </div>
                            </div>
                            <div class="remaining-badge ${badgeClass}" data-remaining-for="${i}">${badgeText}</div>
                            <div class="time-info-row" style="border-top:none;margin-top:2px;padding:4px 0 0;">
                                <span class="label">Latest start</span>
                                <span class="value ${overdue ? 'warn' : ''}">${latestStart >= 0 ? formatWeekendTime(latestStart) : 'Already passed'}</span>
                            </div>
                            ${overdue && !t.completed ? `
                                <div class="reminder-box">
                                    <span class="tag">LATE</span>You've passed the latest start time. 
                                </div>
                            ` : ''}
                            ${soon && !t.completed ? `
                                <div class="reminder-box">
                                    <span class="tag">SOON</span>Starting within ${formatDuration(remainMin)}. 
                                </div>
                            ` : ''}
                            ${!t.completed && t.duration >= 120 ? `
                                <div class="reminder-box">
                                    <span class="tag">TIPS</span>Break this into ${Math.ceil(t.duration/45)} blocks of 45 min. Rest 10 min between.
                                </div>
                            ` : ''}
                            ${!t.completed && t.photos && t.photos.length === 0 ? `
                                <div class="reminder-box">
                                    <span class="tag">PROOF</span>Upload a photo when you're done to keep yourself honest.
                                </div>
                            ` : ''}
                            <div class="photo-upload-area">
                                <button class="photo-upload-btn" data-wi="${i}" data-waction="upload">Upload Proof</button>
                                <input type="file" accept="image/*" data-wi="${i}" class="weekend-photo-input" style="display:none;" />
                            </div>
                            ${t.photos && t.photos.length ? `
                                <div class="photo-preview">
                                    ${t.photos.map((p, pi) => `<img class="photo-thumb" src="${p}" data-photo="${i}-${pi}" />`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
                html += `</div>`;
                return html;
            }

            function bindWeekendActions() {
                document.querySelectorAll('[data-waction="toggle"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const i = parseInt(this.dataset.wi);
                        if (i < 0 || i >= weekendTasks.length) return;
                        weekendTasks[i].completed = !weekendTasks[i].completed;
                        saveData();
                        renderWeekend();
                    });
                });
                document.querySelectorAll('[data-waction="delete"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const i = parseInt(this.dataset.wi);
                        if (i < 0 || i >= weekendTasks.length) return;
                        if (confirm(`Delete "${weekendTasks[i].subject}"?`)) {
                            weekendTasks.splice(i, 1);
                            saveData();
                            renderWeekend();
                        }
                    });
                });
                document.querySelectorAll('[data-waction="upload"]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const i = parseInt(this.dataset.wi);
                        const input = document.querySelector(`.weekend-photo-input[data-wi="${i}"]`);
                        if (input) input.click();
                    });
                });
                document.querySelectorAll('.weekend-photo-input').forEach(input => {
                    input.addEventListener('change', async function(e) {
                        const i = parseInt(this.dataset.wi);
                        const file = e.target.files[0];
                        if (!file) return;
                        try {
                            const base64 = await compressImage(file, 800, 0.7);
                            if (!weekendTasks[i].photos) weekendTasks[i].photos = [];
                            weekendTasks[i].photos.push(base64);
                            saveData();
                            renderWeekend();
                        } catch (err) {
                            console.error(err);
                            alert('Failed to process image.');
                        }
                    });
                });
                document.querySelectorAll('.photo-thumb').forEach(img => {
                    img.addEventListener('click', function() {
                        openPhotoViewer(this.src);
                    });
                });
            }

            function addWeekendTask() {
                const subject = document.getElementById('weekendSubject').value.trim();
                const duration = parseInt(document.getElementById('weekendDuration').value) || 0;
                const slider = document.getElementById('deadlineSlider');
                const deadline = parseInt(slider.value) * 15;

                if (!subject) { alert('Please enter a subject'); return; }
                if (duration <= 0) { alert('Please enter duration in minutes (e.g. 60)'); return; }
                if (duration > WINDOW_TOTAL_MIN) { alert('Duration cannot exceed the whole weekend window'); return; }

                const latestStart = deadline - duration;
                if (latestStart < 0) {
                    if (!confirm('This task cannot be completed in time if it is not started immediately. Add anyway?')) return;
                }

                weekendTasks.push({
                    id: Date.now().toString(),
                    subject: subject,
                    duration: duration,
                    deadline: deadline,
                    completed: false,
                    photos: [],
                    createdAt: Date.now()
                });
                saveData();
                renderWeekend();
            }

            // ================================================================
            // Carousel
            // ================================================================
            function setPage(index, animate = true) {
                if (index === currentPage && animate) return;
                currentPage = index;
                if (!animate) {
                    track.style.transition = 'none';
                } else {
                    track.style.transition = 'transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1)';
                }
                track.style.transform = `translateX(-${index * 100}%)`;
                dots.forEach((dot, i) => dot.classList.toggle('active', i === index));

                if (!animate) {
                    void track.offsetHeight;
                    track.style.transition = 'transform 0.4s cubic-bezier(0.22, 0.68, 0.35, 1)';
                }
            }

            const carousel = document.getElementById('carousel');
            let dragStartX = 0, dragStartY = 0;
            let isDragging = false, isHorizontal = false;
            let dragStartOffset = 0;

            function isInteractiveElement(el) {
                if (!el) return false;
                const tag = el.tagName.toLowerCase();
                if (tag === 'input' || tag === 'button' || tag === 'select' || tag === 'textarea') return true;
                if (el.isContentEditable) return true;
                if (el.closest && el.closest('input, button, select, textarea, .nt-slider, .photo-upload-btn, .supervisor-toggle, .log-delete-toggle')) return true;
                return false;
            }

            carousel.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (isInteractiveElement(target)) { isDragging = false; return; }
                dragStartX = touch.clientX;
                dragStartY = touch.clientY;
                isDragging = true;
                isHorizontal = false;
                dragStartOffset = -currentPage * 100;
                track.style.transition = 'none';
            }, { passive: true });

            carousel.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                const touch = e.touches[0];
                const dx = touch.clientX - dragStartX;
                const dy = touch.clientY - dragStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                    isHorizontal = true;
                    e.preventDefault();
                    const dampened = dx * 0.6;
                    const offsetPercent = (dampened / carousel.offsetWidth) * 100;
                    let newOffset = dragStartOffset + offsetPercent;
                    const maxIndex = dots.length - 1;
                    if (newOffset > 0) newOffset = 0;
                    if (newOffset < -maxIndex * 100) newOffset = -maxIndex * 100;
                    track.style.transform = `translateX(${newOffset}%)`;
                }
            }, { passive: false });

            carousel.addEventListener('touchend', function(e) {
                if (!isDragging) return;
                isDragging = false;
                if (!isHorizontal) return;
                const dx = e.changedTouches[0].clientX - dragStartX;
                const threshold = 40;
                if (dx < -threshold && currentPage < dots.length - 1) setPage(currentPage + 1);
                else if (dx > threshold && currentPage > 0) setPage(currentPage - 1);
                else setPage(currentPage);
            }, { passive: true });

            let mouseDown = false, mouseStartX = 0, mouseStartOffset = 0;
            carousel.addEventListener('mousedown', function(e) {
                if (isInteractiveElement(e.target)) { mouseDown = false; return; }
                mouseDown = true;
                mouseStartX = e.clientX;
                mouseStartOffset = -currentPage * 100;
                track.style.transition = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', function(e) {
                if (!mouseDown) return;
                const dx = e.clientX - mouseStartX;
                const dampened = dx * 0.6;
                const offsetPercent = (dampened / carousel.offsetWidth) * 100;
                let newOffset = mouseStartOffset + offsetPercent;
                const maxIndex = dots.length - 1;
                if (newOffset > 0) newOffset = 0;
                if (newOffset < -maxIndex * 100) newOffset = -maxIndex * 100;
                track.style.transform = `translateX(${newOffset}%)`;
            });
            document.addEventListener('mouseup', function(e) {
                if (!mouseDown) return;
                mouseDown = false;
                const dx = e.clientX - mouseStartX;
                const threshold = 40;
                if (dx < -threshold && currentPage < dots.length - 1) setPage(currentPage + 1);
                else if (dx > threshold && currentPage > 0) setPage(currentPage - 1);
                else setPage(currentPage);
            });

            dots.forEach((dot, i) => {
                dot.addEventListener('click', function() { setPage(i); });
            });

            // ================================================================
            // Periodic update of remaining-time badges
            // ================================================================
            setInterval(() => {
                if (currentPage !== 1) return;
                document.querySelectorAll('[data-remaining-for]').forEach(el => {
                    const i = parseInt(el.dataset.remainingFor);
                    if (isNaN(i) || !weekendTasks[i]) return;
                    const t = weekendTasks[i];
                    const remainMin = minutesUntilLatestStart(t);
                    if (t.completed) {
                        el.className = 'remaining-badge done';
                        el.textContent = '✓ completed';
                    } else if (remainMin < 0) {
                        el.className = 'remaining-badge overdue';
                        el.textContent = formatRemaining(remainMin);
                    } else if (remainMin < 30) {
                        el.className = 'remaining-badge now';
                        el.textContent = formatRemaining(remainMin);
                    } else {
                        el.className = 'remaining-badge ok';
                        el.textContent = formatRemaining(remainMin);
                    }
                });
            }, 30000);

            // ================================================================
            // Init
            // ================================================================
            loadData();
            renderTasks();
            renderTimer();
            renderWeekend();
            setPage(1, false);

            celebrationEl.addEventListener('click', function() {
                this.classList.remove('active');
                if (celebrationTimer) { clearTimeout(celebrationTimer); celebrationTimer = null; }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'INPUT') {
                    const inputs = ['subjectInput', 'timeInput', 'totalCount'];
                    if (inputs.includes(document.activeElement.id)) addTask();
                    const wInputs = ['weekendSubject', 'weekendDuration'];
                    if (wInputs.includes(document.activeElement.id)) addWeekendTask();
                }
            });

            // Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function(reg) { console.log('SW registered:', reg); })
                        .catch(function(err) { console.log('SW registration failed:', err); });
                });
            }
        })();
    </script>
</body>
</html>
